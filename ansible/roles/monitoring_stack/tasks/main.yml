---
- name: Create Sherlock Logs directory
  ansible.builtin.file:
    path: "{{ monitoring_root }}"
    state: directory
    owner: devops
    group: devops
    mode: "0755"

- name: Copy monitoring stack configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/"
    dest: "{{ monitoring_root }}/"
    owner: devops
    group: devops
    mode: preserve

- name: Validate monitoring Compose configuration
  ansible.builtin.command:
    cmd: docker compose config
    chdir: "{{ monitoring_root }}"
  changed_when: false

- name: Start monitoring and logging stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ monitoring_root }}"
  register: monitoring_compose
  changed_when: true

- name: Wait for Prometheus
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_ports.prometheus }}/-/ready"
    status_code: 200
  register: prometheus_ready
  retries: 30
  delay: 5
  until: prometheus_ready.status == 200

- name: Wait for Elasticsearch
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_ports.elasticsearch }}/_cluster/health"
    status_code: 200
  register: elasticsearch_ready
  retries: 40
  delay: 5
  until: elasticsearch_ready.status == 200

- name: Wait for Grafana
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_ports.grafana }}/api/health"
    status_code: 200
  register: grafana_ready
  retries: 30
  delay: 5
  until: grafana_ready.status == 200
