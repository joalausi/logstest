server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /server-info.json {
        alias /tmp/server-info.json;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /api/metrics {
        proxy_pass http://backend.cluster-chronicles.svc.cluster.local:3000/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/health {
        proxy_pass http://backend.cluster-chronicles.svc.cluster.local:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
